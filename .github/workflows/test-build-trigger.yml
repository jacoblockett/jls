name: Test Build Trigger

on:
  create:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'jls-test/')
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch non-release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build.yml --repo "$GH_REPO" --ref main -f action=build

      - name: Delete ephemeral trigger branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.ref }}
        run: gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
