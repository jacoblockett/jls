name: Release

on:
  workflow_dispatch:
    inputs:
      change:
        description: Version change
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - replace current

concurrency:
  group: ${{ github.repository }}-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      replace_current: ${{ steps.version.outputs.replace_current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ inputs.change }}
        run: |
          set -euo pipefail

          current=0.0.0
          current_tag=''
          latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
          if [[ -n "$latest_tag" ]]; then
            [[ "$latest_tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2; exit 1; }
            current="${latest_tag#v}"
            current_tag="$latest_tag"
          fi

          IFS=. read -r major minor patch <<< "$current"
          replace_current=false
          case "$CHANGE" in
            major) version="$((10#$major + 1)).0.0" ;;
            minor) version="$major.$((10#$minor + 1)).0" ;;
            patch) version="$major.$minor.$((10#$patch + 1))" ;;
            'replace current')
              [[ -n "$current_tag" ]] || { echo 'There is no current stable release to replace.' >&2; exit 1; }
              version="$current"
              replace_current=true
              ;;
            *) echo "Unknown release change: $CHANGE" >&2; exit 1 ;;
          esac

          release_tag="v$version"
          git fetch origin --tags --force
          if [[ "$replace_current" != true ]] && git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "Tag $release_tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "replace_current=$replace_current" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yaml
    with:
      target: all
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: build/release
      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          REPLACE_CURRENT: ${{ needs.prepare.outputs.replace_current }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          (( ${#assets[@]} > 0 )) || { echo 'Verified release bundle is empty.' >&2; exit 1; }

          if [[ "$REPLACE_CURRENT" == true ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --cleanup-tag --yes
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
