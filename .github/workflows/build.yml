name: Build

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      version:
        description: Stable semantic version (for example 0.1.0)
        required: false
        type: string
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jls-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      should_build: ${{ steps.mode.outputs.should_build }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      build_version: ${{ steps.mode.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=nightly
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            mode='${{ inputs.action }}'
          fi
          if [[ '${{ github.ref }}' != 'refs/heads/main' ]]; then
            echo 'Build and release automation may only run from main.' >&2
            exit 1
          fi

          stable_version=0.0.0
          if latest_tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2
              exit 1
            fi
            stable_version="${latest_tag#v}"
          fi

          semver_gt() {
            local lhs="$1" rhs="$2"
            local l_major l_minor l_patch r_major r_minor r_patch
            IFS=. read -r l_major l_minor l_patch <<< "$lhs"
            IFS=. read -r r_major r_minor r_patch <<< "$rhs"
            if (( 10#$l_major != 10#$r_major )); then (( 10#$l_major > 10#$r_major )); return; fi
            if (( 10#$l_minor != 10#$r_minor )); then (( 10#$l_minor > 10#$r_minor )); return; fi
            (( 10#$l_patch > 10#$r_patch ))
          }

          build_version="$stable_version"

          should_build=true
          release_tag=dev
          if [[ "$mode" == nightly ]]; then
            force='${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}'
            if [[ "$should_build" == true && "$force" != true ]]; then
              git fetch origin --tags --force
              if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
                mapfile -t files < <(git diff --name-only nightly..HEAD -- .github/workflows/build.yml manifest.json src scripts tests package.json bun.lock catalog.json)
                if (( ${#files[@]} == 0 )); then should_build=false; fi
              fi
            fi
            release_tag=nightly
          elif [[ "$mode" == stable ]]; then
            requested_version='${{ inputs.version }}'
            if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Stable releases require an explicit plain-semver version input, for example 0.1.0.' >&2
              exit 1
            fi
            if ! semver_gt "$requested_version" "$stable_version"; then
              echo "Stable version must be greater than current stable $stable_version: $requested_version" >&2
              exit 1
            fi
            build_version="$requested_version"
            release_tag="v$requested_version"
          elif [[ "$mode" != build ]]; then
            echo "Unknown build mode: $mode" >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

      - name: No release build
        if: steps.mode.outputs.should_build != 'true'
        run: echo 'Nothing to build or publish.'

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            installer: jls-windows-x64.exe
            musl: false
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            installer: jls-windows-arm64.exe
            musl: false
          - target: macos-x64
            runner: macos-15-intel
            installer: jls-macos-x64
            musl: false
          - target: macos-arm64
            runner: macos-15
            installer: jls-macos-arm64
            musl: false
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            installer: jls-linux-x64-gnu
            musl: false
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            installer: jls-linux-arm64-gnu
            musl: false
          - target: linux-x64-musl
            runner: ubuntu-24.04
            installer: jls-linux-x64-musl
            musl: true
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            installer: jls-linux-arm64-musl
            musl: true
    runs-on: "${{ matrix.runner }}"
    env:
      JLS_BUILD_TARGET: ${{ matrix.target }}
      JLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      JLS_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build installer target
        shell: bash
        run: bun run build

      - name: Launch compiled installer
        if: matrix.musl == false
        shell: bash
        run: |
          './build/${{ matrix.installer }}' --version

      - name: Launch musl installer in Alpine
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint sh -v "$PWD:/work" -w /work oven/bun:1.4.0-alpine -lc "apk add --no-cache libgcc libstdc++ >/dev/null && ./build/${{ matrix.installer }} --version"

      - name: Run installer unit regressions
        if: matrix.target == 'windows-x64'
        shell: bash
        run: bun run test:installer

      - name: Run target contract tests
        shell: bash
        run: bun test --timeout 20000 tests/targets.test.ts

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/${{ matrix.installer }}
            build/manifest.json

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false
      - name: Aggregate and verify complete installer release
        env:
          JLS_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          JLS_AGGREGATE_INPUT: build/targets
          JLS_AGGREGATE_OUTPUT: build/release
        run: bun scripts/aggregate-release.ts
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode != 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: build/release
      - name: Publish verified release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then echo 'Verified release bundle is empty.' >&2; exit 1; fi

          if [[ "$RELEASE_MODE" == nightly ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
              mapfile -t existing < <(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
              for name in "${existing[@]}"; do
                if [[ ! -f "build/release/$name" ]]; then gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GH_REPO" -y; fi
              done
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title 'Nightly' --notes 'Rolling production-test build from main.' --prerelease --target "$GITHUB_SHA"
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
          fi
