name: 'Build (Do Not Use)'

on:
  workflow_call:
    inputs:
      target:
        description: Build target
        required: false
        default: all
        type: string
      version:
        description: Version to inject; defaults to current stable
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      aggregate: ${{ steps.prepare.outputs.aggregate }}
    steps:
      - name: Resolve build
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=0.0.0
            latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
            if [[ -n "$latest_tag" ]]; then
              [[ "$latest_tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2; exit 1; }
              version="${latest_tag#v}"
            fi
          fi
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Build version must be plain semver: $version" >&2; exit 1; }

          all_matrix="$(jq -nc '{include:[
            {target:"windows-x64",runner:"windows-2025",installer:"jls-windows-x64.exe",musl:false},
            {target:"windows-arm64",runner:"windows-11-vs2026-arm",installer:"jls-windows-arm64.exe",musl:false},
            {target:"macos-x64",runner:"macos-15-intel",installer:"jls-macos-x64",musl:false},
            {target:"macos-arm64",runner:"macos-15",installer:"jls-macos-arm64",musl:false},
            {target:"linux-x64-gnu",runner:"ubuntu-24.04",installer:"jls-linux-x64-gnu",musl:false},
            {target:"linux-arm64-gnu",runner:"ubuntu-24.04-arm",installer:"jls-linux-arm64-gnu",musl:false},
            {target:"linux-x64-musl",runner:"ubuntu-24.04",installer:"jls-linux-x64-musl",musl:true},
            {target:"linux-arm64-musl",runner:"ubuntu-24.04-arm",installer:"jls-linux-arm64-musl",musl:true}
          ]}')"

          matrix="$all_matrix"
          aggregate=true
          if [[ "$REQUESTED_TARGET" != all ]]; then
            matrix="$(jq -c --arg target "$REQUESTED_TARGET" '{include: [.include[] | select(.target == $target)]}' <<< "$all_matrix")"
            [[ "$(jq '.include | length' <<< "$matrix")" -eq 1 ]] || { echo "Unknown build target: $REQUESTED_TARGET" >&2; exit 1; }
            aggregate=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "aggregate=$aggregate" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: "${{ matrix.runner }}"
    env:
      JLS_BUILD_TARGET: ${{ matrix.target }}
      JLS_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build installer target
        shell: bash
        run: bun run build

      - name: Launch compiled installer
        if: matrix.musl == false
        shell: bash
        run: |
          './build/${{ matrix.installer }}' --version

      - name: Launch musl installer in Alpine
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root --entrypoint sh -v "$PWD:/work" -w /work oven/bun:1.4.0-alpine -lc "apk add --no-cache libgcc libstdc++ >/dev/null && ./build/${{ matrix.installer }} --version"

      - name: Run installer unit regressions
        if: matrix.target == 'windows-x64'
        shell: bash
        run: bun run test:installer

      - name: Run target contract tests
        shell: bash
        run: bun test --timeout 20000 tests/targets.test.ts

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: build/${{ matrix.installer }}

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.aggregate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Aggregate and verify complete installer release
        env:
          JLS_AGGREGATE_INPUT: build/targets
          JLS_AGGREGATE_OUTPUT: build/release
        run: bun scripts/aggregate-release.ts

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*
